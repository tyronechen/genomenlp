name: Build

on:
  push:
    tags:
      - 'v*'  
  workflow_dispatch: # allows you to trigger manually

jobs:
  create-env:
    name: ${{ matrix.os }} 
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
        
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Updated to v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3  # Use the action instead
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          environment-file: etc/build.yml
          python-version: "3.9"  # Updated from 3.9 to avoid typing issues
          use-mamba: true

      - name: Install conda-build
        run: |
          mamba install conda-build anaconda-client conda-verify -y

      - name: Build package
        run: |
          mkdir -p build
          # Use conda build instead of conda mambabuild
          conda build -c conda-forge -c tyronechen --output-folder build src/genomenlp/

      - name: Convert and upload packages
        run: |
          USER=tyronechen
          builds=$(find build -name "genomenlp*tar.bz2")
          
          # Convert for multiple platforms
          for build in ${builds}; do
            conda convert ${build} -p all -o build
          done
          
          # Upload all builds
          builds=$(find build -name "genomenlp*tar.bz2")
          for build in ${builds}; do
            anaconda -t ${{ secrets.ANACONDA_TOKEN }} upload -u ${USER} ${build} --force
          done

      - name: Test installation
        run: |
          # Create a fresh environment to test the package
          mamba create -n test-env python=3.10 -y
          mamba activate test-env
          mamba install -c tyronechen -c conda-forge genomenlp -y
          sweep -h
